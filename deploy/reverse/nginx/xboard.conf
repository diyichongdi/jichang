# ============================================================
#  Xboard 面板反代 · Nginx (备选，需自行签发证书)
#  放到 /etc/nginx/sites-available/ 并 ln -s 到 sites-enabled
#  证书可用 certbot --nginx 自动签发
# ============================================================

server {
    listen 80;
    server_name xboard.example.com;

    # 由 certbot 补全 443/证书，或用 certbot 后自动填充
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name xboard.example.com;

    # certbot 会自动填入证书路径
    # ssl_certificate     /etc/letsencrypt/live/xboard.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/xboard.example.com/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Scheme $scheme;
    }
}
